name: Publish to npm

# Publica no npm via Trusted Publishing (OIDC) — sem NPM_TOKEN.
# Dispara ao enviar uma tag vX.Y.Z que bata com a versão do package.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # necessário para o OIDC do npm (trusted publishing + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing exige npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Verificar tag x versão
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME não bate com package.json ($PKG_VERSION)"
            exit 1
          fi

      - run: npm test

      - run: npm publish --access public
