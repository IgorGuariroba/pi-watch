# INVARIANTS (keep for any registry; swap only setup/build/publish steps):
# - trigger: push of a release tag v* (protected by the "tags: release" ruleset)
# - environment: npm; permissions: contents: read, id-token: write
# - checkout of the tag with persist-credentials: false
# - tag is in default-branch history and equals v + version
# - validation runs before publish; no registry token secrets
name: Publish to npm

# Publica no npm via Trusted Publishing (OIDC) — sem NPM_TOKEN.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC do npm (trusted publishing + provenance)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag (on main and equal to package.json version)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Tag $TAG is not in the history of origin/main"; exit 1; }
          expected="v$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$expected" ] || {
            echo "::error::Tag $TAG differs from package.json version ($expected)"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - run: npm install --global npm@12.2.1

      - run: npm test

      - run: npm pack --dry-run

      - run: npm publish --access public --provenance
