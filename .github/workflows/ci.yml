# INVARIANTS (keep when adapting to another stack):
# - runs on pull_request and on pushes to the default branch
# - read-only token (permissions: contents: read), persist-credentials: false
# - fixed job `name:`: the ruleset requires this literal check name
# - runs the project's real install + validation commands
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No dependencies to install: only peerDependencies (provided by Pi), no lockfile.
      - run: npm test

      - run: npm pack --dry-run
